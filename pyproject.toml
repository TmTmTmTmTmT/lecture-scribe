[project]
name = "lecture-scribe"
version = "0.1.0"
description = "macOS 강의 녹음 로컬 전사 앱 (주제 기반 프롬프트 유도)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "PySide6>=6.11.2",
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
mlx = ["mlx-whisper>=0.4.3"]
fuzzy = ["rapidfuzz>=3.9"]
ocr = ["pyobjc-framework-Vision>=10.0"]

[project.scripts]
lecture-scribe = "lecture_scribe.cli:main"
lecture-scribe-gui = "lecture_scribe.gui.app:main"

[dependency-groups]
dev = ["pytest>=8.0", "mypy>=1.11"]
# 배포용 자립 번들 빌드 전용(§4 허용 패키징 도구)
build = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lecture_scribe"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/lecture_scribe"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "mlx_whisper.*", "rapidfuzz.*", "objc.*", "Vision.*", "Quartz.*", "Foundation.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: 실제 모델/토크나이저를 쓰는 테스트"]
